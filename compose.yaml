services:
  db:
    image: postgres:15
    container_name: postgres_poke_api
    environment:
      POSTGRES_DB: poke_api
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: